[package]
name = "treetop-client"
version = "0.1.0"
edition = "2024"
description = "Typed async Rust client for Treetop policy authorization servers"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/treetop-client"
homepage = "https://github.com/treetop-policy-engine/treetop-client"
repository = "https://github.com/treetop-policy-engine/treetop-client"
authors = ["Terje Kvernes"]
keywords = ["authorization", "cedar", "policy", "treetop"]
categories = ["api-bindings", "authentication"]
rust-version = "1.93.1"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md", "docs/**", "MIGRATION.md"]

[features]
server-tests = []

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
url = "2.5.8"
secrecy = "0.10.3"
ipnet = "2.12.2"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
wiremock = "0.6.5"
serde_json = "1.0.151"
rstest = "0.27.0"
regex = "1.13.1"
serial_test = "4.0.1"
proptest = "1.11.0"
libc = "0.2.189"
